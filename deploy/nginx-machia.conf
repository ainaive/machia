# Machia behind nginx on :3000 (TLS). Do not listen on :80/:443.
upstream machia_api {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 3000 ssl;
    listen [::]:3000 ssl;
    server_name agrippa.ainaive.com;

    ssl_certificate     /etc/letsencrypt/live/agrippa.ainaive.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrippa.ainaive.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    gzip on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    root /opt/machia/apps/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://machia_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
